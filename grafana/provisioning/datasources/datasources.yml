# ============================================================
# GRAFANA DATASOURCE PROVISIONING
# Auto-configures all datasources on container startup
# ============================================================
apiVersion: 1

deleteDatasources: []

datasources:

  # ── Prometheus ──
  - name: Prometheus
    type: prometheus
    uid: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true
    jsonData:
      timeInterval: "15s"
      httpMethod: POST

  # ── Loki ──
  - name: Loki
    type: loki
    uid: loki
    access: proxy
    url: http://loki:3100
    editable: true
    jsonData:
      maxLines: 1000

  # ── Alertmanager ──
  - name: Alertmanager
    type: alertmanager
    uid: alertmanager
    access: proxy
    url: http://alertmanager:9093
    editable: true
    jsonData:
      implementation: prometheus
