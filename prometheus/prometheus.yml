# ============================================================
# PROMETHEUS CONFIGURATION
# ============================================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s
  external_labels:
    cluster: "aiops-local"
    environment: "production"

# ────────────────────────────────────────────────────────────
# ALERTING — forward firing rules to Alertmanager
# ────────────────────────────────────────────────────────────
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - "alertmanager:9093"

# ────────────────────────────────────────────────────────────
# RECORDING & ALERTING RULE FILES
# ────────────────────────────────────────────────────────────
rule_files:
  - "/etc/prometheus/rules/*.yaml"
  - "/etc/prometheus/rules/*.yml"

# ────────────────────────────────────────────────────────────
# SCRAPE CONFIGS
# ────────────────────────────────────────────────────────────
scrape_configs:

  # ── Prometheus self-monitoring ──
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
        labels:
          service: prometheus

  # ── Local Node Exporter (host metrics) ──
  - job_name: "node-exporter-local"
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          service: node-exporter
          instance_name: "aiops-host"

  # ── Local cAdvisor (container metrics) ──
  - job_name: "cadvisor"
    static_configs:
      - targets: ["cadvisor:8080"]
        labels:
          service: cadvisor
          instance_name: "aiops-host"

  # ── Loki internal metrics ──
  - job_name: "loki"
    static_configs:
      - targets: ["loki:3100"]
        labels:
          service: loki

  # ── Alertmanager internal metrics ──
  - job_name: "alertmanager"
    static_configs:
      - targets: ["alertmanager:9093"]
        labels:
          service: alertmanager

  # ── Remote Nginx Exporter (dev.regenics.com — 10.10.2.21) ──
  - job_name: "nginx-exporter-remote"
    static_configs:
      - targets: ["10.10.2.21:9113"]
        labels:
          service: nginx
          platform: "dev.regenics.com"
          environment: "production"
          instance_name: "dev-regenics"

  # ── Remote Node Exporter (dev.regenics.com — 10.10.2.21) ──
  - job_name: "node-exporter-remote"
    static_configs:
      - targets: ["10.10.2.21:9100"]
        labels:
          service: node-exporter
          platform: "dev.regenics.com"
          environment: "production"
          instance_name: "dev-regenics"

  # ── Remote Promtail (dev.regenics.com — 10.10.2.21:9080) ──
  # Scrapes nginx_request_duration_ms metrics extracted from logs
  - job_name: "promtail-remote"
    static_configs:
      - targets: ["10.10.2.21:9080"]
        labels:
          service: promtail
          platform: "dev.regenics.com"
          environment: "production"
          instance_name: "dev-regenics"
