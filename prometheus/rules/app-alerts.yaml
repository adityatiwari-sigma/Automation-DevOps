# ============================================================
# PROMETHEUS ALERTING RULES  —  metric-based alerts
# ============================================================
groups:

  # ────────────────────────────────────────────────────────────
  # P1 — CRITICAL / IMMEDIATE
  # ────────────────────────────────────────────────────────────
  - name: p1-critical-metric-alerts
    interval: 15s
    rules:

      - alert: P1_5xxErrorRateCritical
        expr: |
          (
            sum(rate(promtail_custom_nginx_request_duration_ms_count{status=~"5.."}[2m]))
            /
            sum(rate(promtail_custom_nginx_request_duration_ms_count[2m]))
          ) > 0.05
        for: 2m
        labels:
          severity: p1
          tier: critical
          service: nginx
          source: prometheus
          remediation: generic_triage
        annotations:
          summary: "5xx error rate exceeds 5%"
          description: "HTTP 5xx error rate has been above 5% for 2 minutes. Current: {{ $value | humanizePercentage }}."
          platform: "dev.regenics.com"
          environment: "production"
          error_sample: "5xx rate = {{ $value | humanizePercentage }}"
          grafana_dashboard: "http://10.10.2.77:3000/d/error-groups-v2?orgId=1&var-platform={{ $labels.platform }}"
          runbook: "Check nginx error logs. Verify upstream PHP-FPM is healthy. Check deployment status."

      - alert: P1_5xxCountSpike
        expr: |
          sum(increase(nginx_http_requests_total{status=~"5.."}[2m])) > 50
        for: 1m
        labels:
          severity: p1
          tier: critical
          service: nginx
          source: prometheus
          remediation: generic_triage
        annotations:
          summary: "5xx count spike (>50 in 2 min)"
          description: "More than 50 HTTP 5xx errors in the last 2 minutes. Count: {{ $value }}."
          platform: "dev.regenics.com"
          environment: "production"
          error_sample: "5xx count = {{ $value }} in 2 min"
          grafana_dashboard: "http://10.10.2.77:3000/d/error-groups-v2?orgId=1"

  # ────────────────────────────────────────────────────────────
  # P2 — HIGH / WITHIN 1 HOUR
  # ────────────────────────────────────────────────────────────
  - name: p2-high-metric-alerts
    interval: 30s
    rules:

      - alert: P2_HighRequestLatency
        expr: |
          histogram_quantile(0.95, sum(rate(promtail_custom_nginx_request_duration_ms_bucket[5m])) by (le)) > 4500
        for: 5m
        labels:
          severity: p2
          tier: high
          service: nginx
          source: prometheus
        annotations:
          summary: "P95 request latency exceeds 4500ms"
          description: "95th percentile latency above 4500ms for 5 minutes. Current P95: {{ $value }}ms."
          platform: "dev.regenics.com"
          environment: "production"
          grafana_dashboard: "http://10.10.2.77:3000/d/error-groups-v2?orgId=1"

      - alert: P2_SlowURLLatency
        expr: |
          histogram_quantile(0.95, sum by (le, uri) (rate(promtail_custom_nginx_request_duration_ms_bucket[5m]))) > 4500
        for: 5m
        labels:
          severity: p2
          tier: high
          service: nginx
          source: prometheus
        annotations:
          summary: "P95 response time > 4500ms for {{ $labels.uri }}"
          description: "P95 for '{{ $labels.uri }}' above 4500ms for 5 minutes. Current P95: {{ $value }}ms."
          platform: "dev.regenics.com"
          environment: "production"

      - alert: P2_UpstreamConnectionErrors
        expr: |
          sum(rate(nginx_http_requests_total{status=~"502|503|504"}[5m])) > 0.5
        for: 5m
        labels:
          severity: p2
          tier: high
          service: nginx
          source: prometheus
        annotations:
          summary: "Upstream connection errors (502/503/504)"
          description: "Elevated 502/503/504 errors indicate backend PHP-FPM or upstream issues."
          platform: "dev.regenics.com"
          environment: "production"
          grafana_dashboard: "http://10.10.2.77:3000/d/error-groups-v2?orgId=1"

  # ────────────────────────────────────────────────────────────
  # P3 — LOW / DAILY DIGEST
  # ────────────────────────────────────────────────────────────
  - name: p3-low-metric-alerts
    interval: 1m
    rules:

      - alert: P3_DiskSpaceLow
        expr: |
          (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) < 0.20
        for: 30m
        labels:
          severity: p3
          tier: low
          service: node
          source: prometheus
        annotations:
          summary: "Disk space below 20%"
          description: "Root filesystem less than 20% free. Current free: {{ $value | humanizePercentage }}."
          platform: "infrastructure"
          environment: "production"

      - alert: P3_HighMemoryUsage
        expr: |
          (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) > 0.85
        for: 30m
        labels:
          severity: p3
          tier: low
          service: node
          source: prometheus
        annotations:
          summary: "Memory usage above 85%"
          description: "Memory above 85% for 30 minutes. Current: {{ $value | humanizePercentage }}."
          platform: "infrastructure"
          environment: "production"

      - alert: P3_HighCPUUsage
        expr: |
          100 - (avg(rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 85
        for: 30m
        labels:
          severity: p3
          tier: low
          service: node
          source: prometheus
        annotations:
          summary: "CPU usage above 85%"
          description: "Average CPU above 85% for 30 minutes."
          platform: "infrastructure"
          environment: "production"

  # ────────────────────────────────────────────────────────────
  # AUTO-REMEDIATION — metric-triggered
  # ────────────────────────────────────────────────────────────
  - name: auto-remediation-alerts
    interval: 30s
    rules:

      - alert: PHPFPMWorkerPoolExhaustion
        expr: phpfpm_active_processes{pool="www"} / phpfpm_max_active_processes{pool="www"} > 0.90
        for: 1m
        labels:
          severity: p1
          remediation: generic_triage
        annotations:
          summary: "PHP-FPM pool exhaustion (>90%)"
          description: "Active processes above 90% of max_children for 1 minute."

      - alert: RedisMemoryHigh
        expr: redis_memory_used_bytes / redis_memory_max_bytes > 0.90
        for: 2m
        labels:
          severity: p1
          remediation: generic_triage
        annotations:
          summary: "Redis memory usage exceeds 90%"
          description: "Redis using more than 90% of max memory for 2 minutes."

      - alert: HighHTTP5xxRate
        expr: |
          sum(rate(nginx_http_requests_total{status=~"5.."}[2m]))
          /
          sum(rate(nginx_http_requests_total[2m])) > 0.05
        for: 2m
        labels:
          severity: p1
          service: nginx
          remediation: generic_triage
        annotations:
          summary: "High HTTP 5xx error rate"
          description: "More than 5% of requests failing with 5xx errors for 2 minutes."
