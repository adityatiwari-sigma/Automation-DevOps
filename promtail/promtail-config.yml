server:
  http_listen_port: 9080

positions:
  filename: /var/log/promtail/positions.yaml

clients:
  - url: http://10.10.2.77:3100/loki/api/v1/push

scrape_configs:
# 🔹 NGINX ACCESS (JSON)
- job_name: nginx-access
  static_configs:
    - targets: [localhost]
      labels:
        platform: nginx
        log_type: nginx-access
        environment: prod
        __path__: /var/log/nginx/access.log
  pipeline_stages:
    - json:
        expressions:
          status:
          uri:
          latency: response_time_ms
    - labels:
        status:
        uri:
    - metrics:
        nginx_request_duration_ms:
          type: Histogram
          description: "nginx request duration"
          source: latency
          config:
            buckets: [0.01, 0.05, 0.1, 0.25, 0.5, 1, 2.5, 5]
            labels:
              status:
              uri:
              platform:
              environment:

# 🔹 NGINX ERROR (Text)
- job_name: nginx-error
  static_configs:
    - targets: [localhost]
      labels:
        platform: nginx
        log_type: nginx-error
        environment: prod
        __path__: /var/log/nginx/error.log
  pipeline_stages:
    - regex:
        expression: '(?i)(?P<level>error|warn|info|debug|fatal|emergency|critical)'
    - labels:
        level:

# 🔹 PHP-FPM ERROR
- job_name: php-fpm
  static_configs:
    - targets: [localhost]
      labels:
        platform: php-fpm
        log_type: php-fpm-error
        environment: prod
        __path__: /var/log/php*-fpm.log
  pipeline_stages:
    - regex:
        expression: '(?i)(?P<level>error|warn|notice|debug|fatal)'
    - labels:
        level:

# 🔹 MYSQL ERROR
- job_name: mysql
  static_configs:
    - targets: [localhost]
      labels:
        platform: mysql
        log_type: mysql-error
        environment: prod
        __path__: /var/log/mysql/*.log
  pipeline_stages:
    - regex:
        expression: '(?i)(?P<level>error|warning|note|info)'
    - labels:
        level:

# 🔹 PLATFORM LOGS (Laravel/WordPress/Magento)
- job_name: platform-apps
  static_configs:
    - targets: [localhost]
      labels:
        environment: prod
        __path__: /var/www/html/*/storage/logs/*.log
    - targets: [localhost]
      labels:
        environment: prod
        __path__: /var/www/*/wp-content/debug.log
    - targets: [localhost]
      labels:
        environment: prod
        __path__: /var/www/*/var/log/*.log
  pipeline_stages:
    - regex:
        expression: '(?i)(?P<level>error|warning|critical|fatal|notice|info|debug)'
    - labels:
        level:
