server:
  http_listen_port: 9080

positions:
  filename: /var/log/promtail/positions.yaml

clients:
  - url: http://10.10.2.77:3100/loki/api/v1/push

scrape_configs:
# 🔹 NGINX
- job_name: nginx
  static_configs:
    - targets: [localhost]
      labels:
        platform: nginx
        environment: prod
        __path__: /var/log/nginx/*.log
  pipeline_stages:
    # 1. Identify log file name
    - regex:
        source: filename
        expression: '.*/(?P<log_type>[^/]+)\.log'
    # 2. Extract Response Time and Status from JSON logs
    - json:
        expressions:
          status:
          uri:
          latency: response_time_ms
    # 3. Apply labels for Prometheus graphs
    - labels:
        log_type:
        status:
        uri:
    # 4. Create Histogram (Buckets adjusted for raw seconds: 0.1s, 0.5s, 1s, etc.)
    - metrics:
        nginx_request_duration_ms:
          type: Histogram
          description: "nginx request duration"
          source: latency
          config:
            buckets: [0.05, 0.1, 0.25, 0.5, 1, 2.5, 5, 10]
 
    # 5. Masking and Label Formatting
    - replace:
        source: log_type
        expression: 'access'
        replace: 'nginx-access'
    - replace:
        source: log_type
        expression: 'error'
        replace: 'nginx-error'
    - labels:
        log_type:
    - replace:
        expression: '\b\d{1,3}(\.\d{1,3}){3}\b'
        replace: 'MASKED_IP'
    - replace:
        expression: '[a-zA-Z0-9._%+-]+@[a-zA-Z0-9.-]+\.[a-z]{2,}'
        replace: 'MASKED_EMAIL'
    - regex:
        expression: '(?i)(?P<level>error|warn|info|debug|fatal)'
    - labels:
        level:
 
