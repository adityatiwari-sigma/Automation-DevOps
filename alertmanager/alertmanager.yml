# ============================================================
# ALERTMANAGER CONFIGURATION
# Severity-tiered routing with deduplication
# ============================================================

global:
  resolve_timeout: 1m

  # ── SMTP settings for email notifications ──
  # UPDATE: Replace with your actual SMTP credentials
  smtp_smarthost: "smtp.gmail.com:587"
  smtp_from: "" #Email ID here
  smtp_auth_username: "" #Email ID here
  smtp_auth_password: "" #App Password here
  smtp_require_tls: true

# ────────────────────────────────────────────────────────────
# TEMPLATES  —  rich email formatting
# ────────────────────────────────────────────────────────────
templates:
  - "/etc/alertmanager/templates/*.tmpl"

# ────────────────────────────────────────────────────────────
# ROUTE TREE  —  severity-based routing with deduplication
#
# Deduplication via repeat_interval:
#   P1 = 15 minutes (same alert won't re-fire within 15 min)
#   P2 = 1 hour
#   P3 = 24 hours
# ────────────────────────────────────────────────────────────
route:
  receiver: "default-email"
  group_by: ["alertname", "severity", "platform"]
  group_wait: 2s
  group_interval: 5s
  repeat_interval: 4h          # default fallback (P3-level)

  routes:
    # ── AUTO-REMEDIATION: dispatch to webhook ──
    - match_re:
        remediation: ".+"
      receiver: "auto-remediation-webhook"
      group_wait: 1s
      group_interval: 1m
      repeat_interval: 10m
      continue: true

    # ── LCP CORRELATION: root-cause diagnosis alerts ──
    - match_re:
        root_cause: ".+"
      receiver: "lcp-correlation"
      group_by: ["alertname", "root_cause", "platform"]
      group_wait: 15s
      group_interval: 1m
      repeat_interval: 15m
      continue: false

    # ── P1: CRITICAL  —  immediate escalation ──
    - match:
        severity: p1
      receiver: "p1-critical"
      group_wait: 15s            # fire fast
      group_interval: 1m
      repeat_interval: 15m       # cooldown: 15 minutes
      continue: false

    # ── P2: HIGH  —  within 1 hour ──
    - match:
        severity: p2
      receiver: "p2-high"
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 1h        # cooldown: 1 hour
      continue: false

    # ── P3: LOW  —  daily digest ──
    - match:
        severity: p3
      receiver: "p3-daily"
      group_wait: 15s            # Reduced for faster testing (was 5m)
      group_interval: 1m
      repeat_interval: 5m        # Reduced for testing (was 24h)
      continue: false

# ────────────────────────────────────────────────────────────
# RECEIVERS
# ────────────────────────────────────────────────────────────
receivers:

  # ── Auto-remediation webhook ──
  - name: "auto-remediation-webhook"
    webhook_configs:
      - url: "http://10.10.2.77:5051/webhook"
        send_resolved: true

  # ── Default fallback ──
  - name: "default-email"
    email_configs:
      - to: "aditya.tiwari@sigmainfo.net"
        send_resolved: true
        html: '{{ template "email.alert" . }}'
        headers:
          Subject: '[AIOps] {{ .GroupLabels.severity | toUpper }} — {{ .GroupLabels.alertname }}'

  # ── P1: Email + PagerDuty ──
  - name: "p1-critical"
    email_configs:
      - to: "aditya.tiwari@sigmainfo.net"
        send_resolved: true
        html: '{{ template "email.alert" . }}'
        headers:
          Subject: '🚨 [P1-CRITICAL] {{ .GroupLabels.alertname }} — IMMEDIATE ACTION'

  # ── P2: Email only ──
  - name: "p2-high"
    email_configs:
      - to: "" #Email ID here
        send_resolved: true
        html: '{{ template "email.alert" . }}'
        headers:
          Subject: '⚠️ [P2-HIGH] {{ .GroupLabels.alertname }} — respond within 1 hour'

  # ── P3: Email daily digest ──
  - name: "p3-daily"
    email_configs:
      - to: "" #Email ID here
        send_resolved: true
        html: '{{ template "email.alert" . }}'
        headers:
          Subject: 'ℹ️ [P3-LOW] {{ .GroupLabels.alertname }} — daily digest'

  # ── LCP Correlation: enriched root-cause email ──
  - name: "lcp-correlation"
    email_configs:
      - to: "aditya.tiwari@sigmainfo.net"
        send_resolved: true
        html: '{{ template "correlation.alert" . }}'
        headers:
          Subject: '🔍 [LCP-CORRELATION] {{ .GroupLabels.alertname }} — Root Cause: {{ .GroupLabels.root_cause }}'

# ────────────────────────────────────────────────────────────
# INHIBITION RULES
# Suppress lower-severity alerts when higher-severity fires
# for the same service
# ────────────────────────────────────────────────────────────
inhibit_rules:

  # P1 firing → suppress P2 for same platform
  - source_match:
      severity: p1
    target_match:
      severity: p2
    equal: ["platform"]

  # P1 firing → suppress P3 for same platform
  - source_match:
      severity: p1
    target_match:
      severity: p3
    equal: ["platform"]

  # P2 firing → suppress P3 for same platform
  - source_match:
      severity: p2
    target_match:
      severity: p3
    equal: ["platform"]
