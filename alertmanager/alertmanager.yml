# ============================================================
# ALERTMANAGER CONFIGURATION  (generated from this template by generate_configs.py)
# Edit alertmanager/alertmanager.yml.template — NOT the generated alertmanager.yml
# ============================================================

global:
  resolve_timeout: 5m

  smtp_smarthost: "smtp.gmail.com:587"
  smtp_from: "aditya.tiwari@sigmainfo.net"
  smtp_auth_username: "aditya.tiwari@sigmainfo.net"
  smtp_auth_password: "dycppwcjukmgkcfj"
  smtp_require_tls: true

# ────────────────────────────────────────────────────────────
# TEMPLATES  —  rich email formatting
# ────────────────────────────────────────────────────────────
templates:
  - "/etc/alertmanager/templates/*.tmpl"

# ────────────────────────────────────────────────────────────
# ROUTE TREE  —  severity-based routing with deduplication
#
# Deduplication via repeat_interval:
#   P1 = 15 minutes
#   P2 = 1 hour
#   P3 = 24 hours  (daily digest)
# ────────────────────────────────────────────────────────────
route:
  receiver: "default-email"
  group_by: ["alertname", "severity", "platform"]
  group_wait: 30s           # allow correlated alerts to arrive together
  group_interval: 5m
  repeat_interval: 4h       # default fallback (P3-level)

  routes:
    # ── AUTO-REMEDIATION: dispatch to webhook first, then continue to severity route ──
    - match_re:
        remediation: ".+"
      receiver: "auto-remediation-webhook"
      group_wait: 10s
      group_interval: 1m
      repeat_interval: 10m
      continue: true

    # ── LCP CORRELATION: root-cause diagnosis alerts ──
    - match_re:
        root_cause: ".+"
      receiver: "lcp-correlation"
      group_by: ["alertname", "root_cause", "platform"]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 15m
      continue: false

    # ── P1: CRITICAL  —  immediate escalation ──
    - match:
        severity: p1
      receiver: "p1-critical"
      group_wait: 15s
      group_interval: 1m
      repeat_interval: 15m
      continue: false

    # ── P2: HIGH  —  within 1 hour ──
    - match:
        severity: p2
      receiver: "p2-high"
      group_wait: 1m
      group_interval: 5m
      repeat_interval: 1h
      continue: false

    # ── P3: LOW  —  daily digest ──
    - match:
        severity: p3
      receiver: "p3-daily"
      group_wait: 5m
      group_interval: 10m
      repeat_interval: 24h
      continue: false

# ────────────────────────────────────────────────────────────
# RECEIVERS
# ────────────────────────────────────────────────────────────
receivers:

  # ── Auto-remediation webhook (Bearer token auth) ──
  - name: "auto-remediation-webhook"
    webhook_configs:
      - url: "http://192.168.29.25:5051/webhook"
        send_resolved: true
        http_config:
          authorization:
            credentials: "b5e9f7a6eb2e9361855ef5cf32f477ea68537598532c289fe8447bbc694c5dff"

  # ── Default fallback ──
  - name: "default-email"
    email_configs:
      - to: "aditya.tiwari@sigmainfo.net"
        send_resolved: true
        html: '{{ template "email.alert" . }}'
        headers:
          Subject: '[AIOps] {{ .GroupLabels.severity | toUpper }} — {{ .GroupLabels.alertname }}'

  # ── P1: Critical ──
  - name: "p1-critical"
    email_configs:
      - to: "aditya.tiwari@sigmainfo.net"
        send_resolved: true
        html: '{{ template "email.alert" . }}'
        headers:
          Subject: '[P1-CRITICAL] {{ .GroupLabels.alertname }} — IMMEDIATE ACTION'

  # ── P2: High ──
  - name: "p2-high"
    email_configs:
      - to: "aditya.tiwari@sigmainfo.net"
        send_resolved: true
        html: '{{ template "email.alert" . }}'
        headers:
          Subject: '[P2-HIGH] {{ .GroupLabels.alertname }} — respond within 1 hour'

  # ── P3: Low / daily digest ──
  - name: "p3-daily"
    email_configs:
      - to: "aditya.tiwari@sigmainfo.net"
        send_resolved: true
        html: '{{ template "email.alert" . }}'
        headers:
          Subject: '[P3-LOW] {{ .GroupLabels.alertname }} — daily digest'

  # ── LCP Correlation: enriched root-cause email ──
  - name: "lcp-correlation"
    email_configs:
      - to: "aditya.tiwari@sigmainfo.net"
        send_resolved: true
        html: '{{ template "correlation.alert" . }}'
        headers:
          Subject: '[LCP-CORRELATION] {{ .GroupLabels.alertname }} — Root Cause: {{ .GroupLabels.root_cause }}'

# ────────────────────────────────────────────────────────────
# INHIBITION RULES
# Suppress lower-severity alerts when higher-severity fires
# for the same service
# ────────────────────────────────────────────────────────────
inhibit_rules:

  - source_match:
      severity: p1
    target_match:
      severity: p2
    equal: ["platform"]

  - source_match:
      severity: p1
    target_match:
      severity: p3
    equal: ["platform"]

  - source_match:
      severity: p2
    target_match:
      severity: p3
    equal: ["platform"]
