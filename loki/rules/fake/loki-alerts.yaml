groups:
  # ────────────────────────────────────────────────────────────
  # P1 — CRITICAL / IMMEDIATE
  # ────────────────────────────────────────────────────────────
  - name: p1-critical-log-alerts
    interval: 15s
    rules:
      - alert: P1_CheckoutPaymentFatal
        expr: |
          sum(count_over_time({platform=~"nginx|php-fpm|mysql|wordpress|laravel"} |~ `(?i)(fatal|emergency|critical)` |~ `(?i)(/checkout|/payment/|/cart|/order|/billing|/invoice)` [5m])) > 0
        for: 0m
        labels:
          severity: p1
          tier: critical
          source: loki
          remediation: generic_triage
        annotations:
          summary: "🚨 FATAL error in checkout/payment flow"
          description: "A fatal error was detected in the {{ $labels.platform }} logs related to checkout/payment."
          grafana_dashboard: "http://10.10.2.77:3000/d/error-groups-v2"

  # ────────────────────────────────────────────────────────────
  # P2 — HIGH / WITHIN 1 HOUR
  # ────────────────────────────────────────────────────────────
  - name: p2-high-log-alerts
    interval: 15s
    rules:
      - alert: P2_AppFatalRateHigh
        expr: |
          sum by (platform) (count_over_time({platform=~"php-fpm|wordpress|laravel"} |~ `(?i)(php\s*(fatal|parse)\s*error|fatal\s*error.*php|call\s+to\s+undefined|allowed\s+memory\s+size\s+exhausted)` !~ `(?i)(/checkout|/payment/|/cart)` [5m])) > 0
        for: 0m
        labels:
          severity: p2
          tier: high
          source: loki
          remediation: generic_triage
        annotations:
          summary: "⚠️ High Fatal Error Rate on {{ $labels.platform }}"
          description: "Platform {{ $labels.platform }} is reporting fatal errors."
          grafana_dashboard: "http://10.10.2.77:3000/d/error-groups-v2"

      - alert: P2_MySQLIssuesHigh
        expr: |
          sum(count_over_time({platform="mysql"} |~ `(?i)(error|slow\s*query|lock\s+time|table.*is\s+full|access\s+denied)` [5m])) > 0
        for: 0m
        labels:
          severity: p2
          tier: high
          source: loki
          remediation: generic_triage
        annotations:
          summary: "⚠️ MySQL Error/Slow-Query Spike"
          description: "Database platform is reporting elevated errors or slow queries."
          grafana_dashboard: "http://10.10.2.77:3000/d/error-groups-v2"

  # ────────────────────────────────────────────────────────────
  # P3 — LOW / DAILY DIGEST
  # ────────────────────────────────────────────────────────────
  - name: p3-low-log-alerts
    interval: 15s
    rules:
      - alert: P3_PlatformWarningRateElevated
        expr: |
          sum by (platform) (count_over_time({platform=~"nginx|php-fpm|mysql|wordpress|laravel"} |~ `(?i)(warning|notice|deprecated)` [5m])) > 0
        for: 0m
        labels:
          severity: p3
          tier: low
          source: loki
          remediation: generic_triage
        annotations:
          summary: "ℹ️ Elevated Warning Rate on {{ $labels.platform }}"
          description: "Review warnings for {{ $labels.platform }} in the daily digest."
          grafana_dashboard: "http://10.10.2.77:3000/d/error-groups-v2"
